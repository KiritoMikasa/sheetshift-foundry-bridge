name: Publish Foundry module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test module
        run: node --test tests/*.test.mjs
      - name: Build package
        run: python3 scripts/package.py --tag "$GITHUB_REF_NAME"
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/module.json dist/sheetshift-bridge.zip
          --verify-tag --prerelease
          --title "Sheetshift Bridge $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
