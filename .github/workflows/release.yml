name: Publish Foundry module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test module
        run: node --test tests/*.test.mjs
      - name: Build package
        run: python3 scripts/package.py --tag "$RELEASE_TAG"
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/module.json dist/sheetshift-bridge.zip
          --verify-tag --prerelease
          --title "Sheetshift Bridge $RELEASE_TAG"
          --notes-file RELEASE_NOTES.md
